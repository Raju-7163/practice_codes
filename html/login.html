<html>
    <head>
        <title>login</title>
        <style>
      body{
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: aqua;
        background: url(' ') no-repeat;
        background-size:cover ;
        background-position: center;
      }
      .log .text{
      width: 100%;
      height: 50px;
     position: relative;
      margin: 30px 0;
      border: 2px solid rgba( 255,255,255,.2);
      border-radius: 20px;
      }
       .text input{
        width: 100%;
        height: 100%;
        border-radius: 20px;
        background-color: transparent;
       } 
    .log h1{
        text-align: center;
    }
    .btn{
         
        width: 100%;
        height: 45px;
        border-radius: 10px;

      }
      .btn:hover{
        background-color: blue;
        cursor: pointer;
      }
       
        
      
         .log{
           border: 2px solid rgba(255, 255,255, .2);  
           backdrop-filter: blur(2px);
            width:450px;
             color: white;
             padding: 20px 20px;
         } 
          .text input::placeholder{
            color:  black;
            font-weight: 300;
             
          }
           .reg{
            text-align: center;
            text-decoration: none;
           }
           .text i{
            position: absolute;
            right: 20px;
            top: 30%; ;
           } 

          
        </style>
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    </head>
    <body>
        <div class="log">
             
                <h1>login</h1>
                 
                <div class="text">
                    <input type="text" placeholder="name" required>
                    <i class='bx bx-user'></i>
                </div>
                <div class="text">
                    <input type="password" placeholder="password" required>
                    <i class='bx bx-lock-alt'></i>
                </div>
                <div class="text">
                    <input type="email" placeholder="email" required>
                    <i class='bx bxl-gmail' ></i>
                </div><br>
                <div  >
                    <button type=" submit" class="btn"  formaction=" google.com" >login</button>
                </div>
                <div class="reg">
                    <p>already have a account ? <a href=" #">register</a></p>
                </div>

            
        </div>
    </body>
</html>
